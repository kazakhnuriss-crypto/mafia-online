
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090d">
  <title>MAFIA ONLINE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <header class="header">
      <a class="logo" href="#" onclick="goHome()">MAFIA<span>.</span></a>
      <div class="header-right">
        <span class="online-indicator"></span>
        <span class="online-label" data-i18n="online">ONLINE</span>
        <button class="avatar" onclick="showProfile()">👤</button>
      </div>
    </header>

    <main id="main">
      <section class="hero">
        <div class="eyebrow"><span></span> MAFIA MULTIPLAYER</div>
        <h1>TRUST<br><span>NO ONE.</span></h1>
        <p data-i18n="subtitle">Your friends. Your enemies. One city.</p>

        <button class="btn btn-primary" onclick="createRoom()" data-i18n="create">CREATE ROOM</button>
        <button class="btn btn-outline" onclick="joinRoom()" data-i18n="join">JOIN ROOM</button>

        <div class="hero-bottom">
          <span>●</span> <span data-i18n="ready">THE CITY IS WAITING</span>
        </div>
      </section>

      <section class="stats">
        <div class="stat-card">
          <span class="stat-icon">♟</span>
          <strong id="online-count">0</strong>
          <small data-i18n="playersOnline">PLAYERS ONLINE</small>
        </div>
        <div class="stat-card">
          <span class="stat-icon">♜</span>
          <strong id="games-count">0</strong>
          <small data-i18n="gamesPlayed">GAMES PLAYED</small>
        </div>
      </section>

      <section class="section">
        <div class="section-heading">
          <h2 data-i18n="menu">EXPLORE</h2>
          <span class="section-line"></span>
        </div>

        <div class="menu-grid">
          <button class="menu-card" onclick="showFriends()">
            <span>♟</span>
            <b data-i18n="friends">Friends</b>
            <small data-i18n="friendsDesc">Your people</small>
          </button>

          <button class="menu-card" onclick="showLeaderboard()">
            <span>♛</span>
            <b data-i18n="leaderboard">Leaderboard</b>
            <small data-i18n="leaderDesc">Top players</small>
          </button>

          <button class="menu-card" onclick="showHistory()">
            <span>◷</span>
            <b data-i18n="history">History</b>
            <small data-i18n="historyDesc">Past games</small>
          </button>

          <button class="menu-card" onclick="showSettings()">
            <span>⚙</span>
            <b data-i18n="settings">Settings</b>
            <small data-i18n="settingsDesc">Customize</small>
          </button>
        </div>
      </section>

      <section class="section room-section" id="room-section" hidden>
        <div class="section-heading">
          <h2 data-i18n="yourRoom">YOUR ROOM</h2>
          <span class="section-line"></span>
        </div>

        <div class="room-card">
          <div class="room-top">
            <span class="room-status">
              <i></i><span data-i18n="waiting">WAITING FOR PLAYERS</span>
            </span>
            <span class="room-code" id="room-code">------</span>
          </div>

          <h3 id="room-title">MAFIA ROOM</h3>
          <p id="room-description"></p>

          <div class="room-actions">
            <button class="btn btn-primary" onclick="copyRoomCode()" data-i18n="copyCode">COPY CODE</button>
            <button class="btn btn-outline" onclick="leaveRoom()" data-i18n="leave">LEAVE</button>
          </div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" onclick="goHome()">
        <span>⌂</span><small data-i18n="home">Home</small>
      </button>
      <button class="nav-item" onclick="createRoom()">
        <span>♟</span><small data-i18n="play">Play</small>
      </button>
      <button class="nav-item" onclick="showFriends()">
        <span>♧</span><small data-i18n="friends">Friends</small>
      </button>
      <button class="nav-item" onclick="showSettings()">
        <span>⚙</span><small data-i18n="settings">Settings</small>
      </button>
    </nav>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" onclick="closeModal()"></div>
    <div class="modal-box">
      <button class="close-btn" onclick="closeModal()">×</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Supabase library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Project configuration -->
  <script src="config.js"></script>

  <!-- Main game script -->
  <script src="script.js"></script>
</body>
</html>
